<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="theme-color" content="#F6F2E8">
<title>Life OS</title>
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3">
<link rel="preload" as="image" href="moss_fog_real.jpg">
</head>
<body>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<div id="auth">
<div class="auth-wordmark">Life OS</div>
<div class="auth-title">Привет</div>
<div class="auth-divider"></div>
<div class="auth-body">Нажми кнопку — Ива пришлёт код в Telegram</div>
<button class="btn btn-ghost" id="req-btn" onclick="requestCode()">Получить код</button>
<input class="field code-field" id="code-inp" type="number"
placeholder="000000" maxlength="6" style="display:none"
oninput="if(this.value.length===6) verifyCode()">
<div class="auth-err" id="auth-err">Неверный или истёкший код</div>
</div>
<div id="app-open">
<div class="moss-boot" id="moss-boot">
<img class="layer-sharp" src="moss_fog_real.jpg">
<div class="fog-veil" id="fog-veil"></div>
</div>
</div>
<div id="app" class="gone">
<div class="scroll-area" id="scroll">
<div class="screen on" id="s-home">
<div class="page-top">
<div class="page-label" id="h-label">сегодня</div>
<div class="page-title" id="h-title">—</div>
</div>
<div class="flow" id="home-flow">
<div class="bload">
<div class="bload-bar" style="top:0"></div>
<div class="bload-bar" style="top:70px"></div>
<div class="bload-bar" style="top:140px"></div>
<div class="bload-chip b1">📅</div>
<div class="bload-chip b2">✨</div>
<div class="bload-chip b3">🌿</div>
</div>
</div>
</div>
<div class="screen" id="s-health">
<div class="page-top">
<div class="page-label">данные</div>
<div class="page-title">Здоровье</div>
</div>
<div class="seg" id="seg-health">
<button class="seg-btn on" onclick="hTab('metrics',this)">Показатели</button>
<button class="seg-btn" onclick="hTab('mood',this)">Состояние</button>
<button class="seg-btn" onclick="hTab('supps',this)">БАДы</button>
<button class="seg-btn" onclick="hTab('measure',this)">Замеры</button>
</div>
<div id="ht-metrics"></div>
<div id="ht-mood" style="display:none"></div>
<div id="ht-supps" style="display:none"></div>
<div id="ht-measure" style="display:none"></div>
</div>
<div class="screen" id="s-workouts">
<div class="page-top">
<div class="page-label">активность</div>
<div class="page-title">Тренировки</div>
</div>
<div id="workout-flow">
<div class="bload">
<div class="bload-bar" style="top:0"></div>
<div class="bload-bar" style="top:70px"></div>
<div class="bload-bar" style="top:140px"></div>
<div class="bload-chip b1">📅</div>
<div class="bload-chip b2">✨</div>
<div class="bload-chip b3">🌿</div>
</div>
</div>
</div>
<div class="screen" id="s-lists">
<div class="page-top">
<div class="page-label">органайзер</div>
<div class="page-title">Списки</div>
</div>
<div class="seg" id="seg-lists">
<button class="seg-btn on" onclick="lTab('tasks',this)">Задачи</button>
<button class="seg-btn" onclick="lTab('work',this)">Работа</button>
<button class="seg-btn" onclick="lTab('shopping',this)">Купить</button>
<button class="seg-btn" onclick="lTab('watch',this)">Смотреть</button>
<button class="seg-btn" onclick="lTab('gifts',this)">Подарки</button>
</div>
<div id="lt-tasks"></div>
<div id="lt-work" style="display:none"></div>
<div id="lt-shopping" style="display:none"></div>
<div id="lt-watch" style="display:none"></div>
<div id="lt-gifts" style="display:none"></div>
</div>
<button class="margo-fab" onclick="openMargoPanel()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
</button>
<div class="margo-backdrop" id="margo-backdrop" onclick="closeMargoPanel()"></div>
<div class="margo-panel" id="margo-panel">
<div class="margo-panel-head">
<span class="page-label" style="margin:0">ассистент</span>
<button class="margo-close" onclick="closeMargoPanel()">✕</button>
</div>
<div class="qa-grid" id="qa-grid"></div>
<div class="chat-area" id="chat-area"></div>
<div class="chat-input-bar">
<textarea class="chat-field" id="chat-inp" rows="1"
placeholder="Запиши, спроси, надиктуй…"
oninput="autoH(this)" onkeydown="chatKey(event)"></textarea>
<button class="send-btn" onclick="chatSend()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
<path d="M12 19V5M5 12l7-7 7 7"/>
</svg>
</button>
</div>
</div>
</div>
<nav class="tabbar">
<button class="tab on" id="tab-home" onclick="goTab('home')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
Главная
</button>
<button class="tab" id="tab-health" onclick="goTab('health')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
Здоровье
</button>
<button class="tab" id="tab-workouts" onclick="goTab('workouts')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 5v14M18 5v14M3 8h3M18 8h3M3 16h3M18 16h3M6 11h12"/></svg>
Тренировки
</button>
<button class="tab" id="tab-lists" onclick="goTab('lists')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
Списки
</button>
</nav>
</div>
</div>
<div class="overlay gone" id="overlay" onclick="overlayClick(event)">
<div class="modal" id="modal-body">
<div class="modal-handle"></div>
</div>
</div>
<div id="toast"></div>
<script src="app.js?v=3"></script>
</body>
</html>
